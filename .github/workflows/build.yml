name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build-args: --bundles app,dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
          # Windows ships both: a standalone exe and an installer.
          - os: windows-latest
            build-args: --bundles nsis
            artifacts: |
              src-tauri/target/release/floating-timer.exe
              src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # for attaching builds to a release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npx tauri build ${{ matrix.build-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: floating-timer-${{ runner.os }}
          path: ${{ matrix.artifacts }}

      # Tag a commit like v0.2.0 to attach the builds to a draft GitHub release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.artifacts }}
